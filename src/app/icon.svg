<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="recoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A33" />
      <stop offset="60%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#DD3D00" />
    </linearGradient>
    <filter id="recoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF5500" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Badge -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#recoGrad)" filter="url(#recoShadow)" />

  <!-- Bold White Reco 'R' Logo Character -->
  <text 
    x="50%" 
    y="54%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#FFFFFF" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="300"
    letter-spacing="-10"
  >
    R
  </text>
</svg>
